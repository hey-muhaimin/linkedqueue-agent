<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sprig — terminal mockup</title>
<style>
:root{--bg:#f2f2f2;--fg:#1c1c1c;--dim:#6a6a6a;--faint:#a8a8a8;--line:#cfcfcf;--sel:#e4e4e4;--ibg:#1c1c1c;--ifg:#f2f2f2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0c;--fg:#d0d0d0;--dim:#7c7c7c;--faint:#4a4a4a;--line:#2a2a2a;--sel:#181818;--ibg:#d0d0d0;--ifg:#0c0c0c}}
:root[data-theme="dark"]{--bg:#0c0c0c;--fg:#d0d0d0;--dim:#7c7c7c;--faint:#4a4a4a;--line:#2a2a2a;--sel:#181818;--ibg:#d0d0d0;--ifg:#0c0c0c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);display:flex;flex-direction:column;overflow:hidden;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:clamp(12.5px,.35vw + 11px,14.5px);line-height:1.55;font-variant-ligatures:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:1px dashed var(--fg);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--dim);flex:none}
.top b{color:var(--fg);font-weight:700}.top .sp{flex:1}
.tx{padding:1px 4px}.tx:hover,.chip:hover,.btn:hover,.btn:focus-visible{background:var(--ibg);color:var(--ifg)}
#feed{flex:1;overflow:auto;padding:12px 14px 6px;min-height:0}
#t,#w{max-width:88ch;margin:0 auto}
#t>div{margin:0 0 6px;white-space:pre-wrap;word-break:break-word}
.dim{color:var(--dim)}.faint{color:var(--faint)}.b{font-weight:700}.inv{background:var(--ibg);color:var(--ifg);padding:0 5px}
.you{color:var(--fg);margin-top:14px!important}.you::before{content:"› ";font-weight:700}
.say,.tool,.res{padding-left:2ch;text-indent:-2ch}.res{padding-left:4ch;color:var(--dim)}
.tool{cursor:default}.res.t{cursor:pointer}.res.t:hover{color:var(--fg)}
.more{display:none;padding-left:4ch;color:var(--dim);white-space:pre!important;overflow-x:auto}.more.on{display:block}
pre{margin:0;font:inherit;white-space:pre;overflow-x:auto}
.plan{border:1px solid var(--line);padding:6px 10px}.plan .bar{letter-spacing:1px}.plan .cur{display:none}
.ask{border:1px solid var(--fg);padding:8px 12px;margin:10px 0 12px!important}
.ask .h{margin-bottom:6px}.ask .code{border-left:2px solid var(--faint);padding-left:10px;margin:6px 0;color:var(--fg)}
.ask .acts{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--fg);padding:2px 10px}.ask.done{border-color:var(--line);color:var(--dim)}.ask.done .acts{display:none}
.file{cursor:pointer}.file:hover{background:var(--sel)}
.doc{border:1px solid var(--line);padding:8px 12px;display:none;margin-top:4px}.doc.on{display:block}
#w{color:var(--dim);height:1.6em;display:none}body.busy #w{display:block}
body.wait #w .sp::after{content:" · waiting for you"}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 0;flex:none;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);padding:1px 9px;white-space:nowrap;color:var(--dim)}
.in{display:flex;gap:8px;align-items:center;margin:6px 14px 0;border:1px solid var(--line);padding:6px 10px;flex:none}
.in:focus-within{border-color:var(--fg)}.in b{color:var(--fg)}
#q{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;caret-color:var(--fg);outline:0}
#q::placeholder{color:var(--faint)}
.st{display:flex;gap:14px;padding:5px 14px 7px;color:var(--dim);flex:none;flex-wrap:wrap}.st .sp{flex:1}
body.busy #sd::before{content:"◐"}#sd::before{content:"●"}
.tbl{white-space:pre!important;overflow-x:auto}
@media (min-width:700px) and (min-height:620px){.plan{position:sticky;top:0;z-index:2;background:var(--bg)}}
aside{display:none;flex:none;flex-direction:column;overflow:auto;min-height:0}
.cols{flex:1;min-height:0;display:flex}#mn{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#lr{width:230px;border-right:1px solid var(--line)}#rr{width:320px;border-left:1px solid var(--line)}
.rh{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 4px;color:var(--dim);font-size:.85em;letter-spacing:.1em;text-transform:uppercase}
.ri{display:flex;justify-content:space-between;gap:8px;padding:2px 14px;width:100%;text-align:left}
button.ri:hover,.cmd:hover{background:var(--ibg);color:var(--ifg)}.cmd span:last-child{color:var(--dim)}.cmd:hover span:last-child{color:var(--ifg)}
#rp>div{padding:0 14px}#rp .cur{display:none}#rp .ph{margin-bottom:4px}
#rp:empty::before,#rf:empty::before,#re:empty::before{content:"\2014";padding:0 14px;color:var(--faint)}
#rr>*{flex:none}#rr #rv{flex:1 0 180px;display:none;flex-direction:column;border-top:1px solid var(--line);margin-top:14px}#rr #rv.on{display:flex}
#rv .rh{padding-top:8px;text-transform:none;letter-spacing:0}#rvb{flex:1;overflow:auto;padding:4px 14px 12px;margin:0}
@media (min-width:960px){#rr{display:flex}#t .plan{display:none}}
@media (min-width:1360px){#lr{display:flex}.chips{display:none}#t,#w{max-width:96ch}}
@media (max-width:560px){.kb{display:none}.plan{cursor:pointer}.plan>div:not(.ph){display:none}.plan.open>div{display:block}.plan .cur{display:inline;font-weight:400;color:var(--dim)}.plan.open .cur{display:none}.ask .acts .btn{flex:1;text-align:center}}
@media (max-width:420px){.top .sub{display:none}#feed{padding-inline:10px}.in{margin-inline:10px}.top,.chips,.st{padding-inline:10px}}
@media (max-height:480px){.top{padding-block:4px}.top .sub,.chips,.st{display:none}#feed{padding-top:6px}}
@media (pointer:coarse){#q{font-size:16px}.btn{padding:8px 14px}.chip{padding:6px 12px}.tx{padding:6px 8px}.file,.res.t{padding-top:3px;padding-bottom:3px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top"><b>sprig</b><span class="sub">growth agent · mockup</span><span class="sp"></span><button class="tx" id="th" aria-label="Toggle theme">[theme]</button></div>
<div class="cols"><aside id="lr"><div class="rh">commands</div><div id="lc"></div><div class="rh">session</div><div class="ri"><span class="dim">status</span><span id="ls">ready</span></div><div class="ri"><span class="dim">tool calls</span><span id="ltc">0</span></div><div class="rh">keys</div><div class="ri"><span>y / n</span><span class="dim">approve</span></div><div class="ri"><span>esc</span><span class="dim">interrupt</span></div><div class="ri"><span>↑ ↓</span><span class="dim">history</span></div><div class="ri"><span>ctrl+k</span><span class="dim">focus input</span></div></aside><main id="mn"><div id="feed" role="log" aria-live="polite"><div id="t"></div><div id="w"><span id="sp">⠋</span> <span id="wt">working</span><span class="sp"></span></div></div>
<div class="chips" id="chips"></div>
<div class="in"><b>›</b><input id="q" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="message or /help" aria-label="Message Sprig"></div>
</main><aside id="rr"><div class="rh">plan</div><div id="rp"></div><div class="rh">files</div><div id="rf"></div><div class="rh">experiments</div><div id="re"></div><div id="rv"><div class="rh"><span id="rvt"></span><button class="tx" id="rvx" aria-label="Close viewer">[x]</button></div><pre id="rvb"></pre></div></aside></div>
<div class="st"><span><span id="sd"></span> <span id="ss">ready</span></span><span id="sn">0 tools</span><span class="sp"></span><span class="kb">y/n approve · esc interrupt · ↑ history</span></div>
<script>
const $=s=>document.querySelector(s),T=$('#t'),F=$('#feed'),Q=$('#q'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const root=document.documentElement;
try{const s=localStorage.getItem('sprig-theme');if(s)root.dataset.theme=s}catch(e){}
$('#th').onclick=()=>{const d=root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=d==='dark'?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('sprig-theme',n)}catch(e){}};

/* DOM helpers: text only, no innerHTML */
function ln(cls,...parts){const d=document.createElement('div');d.className=cls||'';parts.forEach(p=>{if(typeof p==='string')d.append(p);else{const s=document.createElement('span');s.className=p[0];s.textContent=p[1];d.append(s)}});T.append(d);scroll();return d}
const near=()=>F.scrollHeight-F.scrollTop-F.clientHeight<140;
function scroll(){F.scrollTop=F.scrollHeight}
let busy=false,abort=false,pend=null,tools=0,hist=[],hi=0,t0=0,tick=0,fr=0;
const EXP=[['shorter signup form','running'],['annual plan nudge','won'],['drop card at trial','lost']];
const sleep=ms=>new Promise((r,j)=>setTimeout(()=>abort?j('abort'):r(),RM?Math.min(ms,20):ms));
const GL={running:'◐',won:'✓',lost:'✗',planned:'○'};
const R={p:$('#rp'),f:$('#rf'),e:$('#re')},wide=()=>matchMedia('(min-width:960px)').matches;
function drawExp(){R.e.replaceChildren();EXP.forEach((x,i)=>{const d=document.createElement('div'),a=document.createElement('span'),b=document.createElement('span');d.className='ri';a.textContent=GL[x[1]]+' '+x[0];b.className='dim';b.textContent='#'+(i+1);d.append(a,b);R.e.append(d)})}
function openFile(n){if(wide()){$('#rvt').textContent=n;$('#rvb').textContent=FILES[n];$('#rv').classList.add('on')}else{FD[n].classList.toggle('on');scroll()}}
function railFile(n){const o=R.f.querySelector('[data-n="'+n+'"]');if(o)o.remove();const b=document.createElement('button');b.className='ri cmd';b.dataset.n=n;const a=document.createElement('span'),c=document.createElement('span');a.textContent='✎ '+n;c.textContent='view';b.append(a,c);b.onclick=()=>openFile(n);R.f.append(b)}
$('#rvx').onclick=()=>$('#rv').classList.remove('on');
const CM=[['/review','weekly review'],['/leads','lead plan'],['/experiment','new experiment'],['/install','add a plugin'],['/experiments','list experiments'],['/artifacts','list files'],['/models','model picker'],['/config','agent config'],['/skills','installed skills'],['/sessions','sessions'],['/help','show help']];
CM.forEach(([c,t])=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>{if(!busy)cmd(c)};$('#chips').append(b)});

/* status + spinner */
function setSt(){document.body.classList.toggle('busy',busy);document.body.classList.toggle('wait',!!pend);$('#ss').textContent=pend?'awaiting approval':busy?'working':'ready';$('#sn').textContent=tools+' tool'+(tools===1?'':'s');Q.placeholder=busy?'working… esc to interrupt':'message or /help';$('#ls').textContent=$('#ss').textContent;$('#ltc').textContent=tools}
function spin(on){clearInterval(tick);if(!on)return;t0=Date.now();tick=setInterval(()=>{fr=(fr+1)%10;$('#sp').textContent='⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'[fr];$('#wt').textContent='working '+Math.floor((Date.now()-t0)/1000)+'s'},90)}

/* plan */
const P={todos:[],at:0,el:null};
function drawPlan(){
  if(!P.el){P.el=ln('plan');P.el.onclick=()=>P.el.classList.toggle('open')}const n=P.todos.length,d=Math.min(P.at,n),w=14,f=Math.round(d/n*w);
  P.el.replaceChildren();
  const h=document.createElement('div');h.className='b ph';h.append('plan  ');const bar=document.createElement('span');bar.className='bar';bar.textContent='█'.repeat(f)+'░'.repeat(w-f);h.append(bar,'  '+d+'/'+n);const cu=document.createElement('span');cu.className='cur';cu.textContent='  ▸ '+(P.todos[d]||'done');h.append(cu);P.el.append(h);
  P.todos.forEach((t,i)=>{const r=document.createElement('div');const s=i<P.at?'✓ ':i===P.at?'▸ ':'○ ';r.textContent=s+t;r.className=i<P.at?'dim':i===P.at?'b':'faint';P.el.append(r)});
  R.p.replaceChildren(...[...P.el.childNodes].map(x=>x.cloneNode(true)));
}

/* steps */
async function type(node,text){
  for(let i=0;i<text.length;i+=3){node.textContent=text.slice(0,i+3);if(near())scroll();await sleep(RM?0:12)}
  node.textContent=text;
}
async function step(e){
  if(e.t==='say'){const d=ln('say','● ');const s=document.createElement('span');d.append(s);await type(s,e.x);await sleep(150)}
  else if(e.t==='plan'){P.todos=e.todos;P.at=0;P.el=null;drawPlan();await sleep(250)}
  else if(e.t==='at'){P.at=e.i;drawPlan();await sleep(120)}
  else if(e.t==='tool'){const d=ln('tool',['dim','○ '],['b',e.name],['dim','('+e.arg+')']);await sleep(e.ms||600);d.firstChild.textContent='● ';tools++;setSt();result(e.out)}
  else if(e.t==='ask'){await ask(e)}
  else if(e.t==='file'){file(e.name,e.body)}
}
function result(out,fail){
  const first=ln('res'+(out.length>1?' t':''),'⎿ ',out[0]+(out.length>1?'  ':''),out.length>1?['faint','+'+(out.length-1)+' more']:'');
  if(fail)first.className+=' b';
  if(out.length>1){const m=ln('more');out.slice(1).forEach(l=>{m.append(l+'\n')});first.onclick=()=>m.classList.toggle('on')}
}
function file(name,body){
  const d=ln('file',['b','✎ '],'wrote ',['b',name],['dim','  [view]']);const doc=document.createElement('div');doc.className='doc';const p=document.createElement('pre');p.textContent=body;doc.append(p);T.append(doc);
  FILES[name]=body;FD[name]=doc;d.onclick=()=>openFile(name);railFile(name);if(wide())openFile(name);
}
const FILES={},FD={};
function ask(e){
  return new Promise(async res=>{
    const a=ln('ask'),h=document.createElement('div');h.className='h';
    h.append(['b','approve? '].map((x,i)=>i?x:'')[1]||'approve? ');const nm=document.createElement('span');nm.className='b';nm.textContent=e.name+' ';const rk=document.createElement('span');rk.className='inv';rk.textContent=e.risk;h.append(nm,rk);a.append(h);
    e.body.forEach(b=>{const c=document.createElement('div');c.className=b.startsWith('  ')||e.code?'code':'';c.textContent=b;c.style.whiteSpace='pre-wrap';a.append(c)});
    if(e.note){const n=document.createElement('div');n.className='dim';n.textContent='! '+e.note;a.append(n)}
    const acts=document.createElement('div');acts.className='acts';
    const y=document.createElement('button'),n=document.createElement('button');y.className=n.className='btn';y.textContent='[y] approve';n.textContent='[n] reject';acts.append(y,n);a.append(acts);
    scroll();
    const decide=ok=>{if(!pend)return;pend=null;a.classList.add('done');const r=document.createElement('div');r.textContent=(ok?'✓ approved once':'✗ rejected');r.className='b';a.append(r);setSt();res(ok)};
    pend={decide};setSt();y.onclick=()=>decide(true);n.onclick=()=>decide(false);y.focus({preventScroll:true});
  }).then(async ok=>{await sleep(500);tools++;setSt();result(ok?e.yes:['Rejected by user.'],!ok);if(ok&&e.after)await step(e.after)});
}

/* scripted sessions (simulated; no backend) */
const S={
review:[
 {t:'plan',todos:['pull KPIs and past experiments','find biggest KPI movement','close out running experiments','propose next experiments','save review.md']},
 {t:'tool',name:'get_kpis',arg:'',out:['4 metrics · week ending sun','signups     412   +12%','mrr         $18.4k  +3%','churn       2.1%  -0.2pt','activation  38%   -4pt']},
 {t:'at',i:1},
 {t:'tool',name:'list_experiments',arg:'',out:['3 experiments','#1 shorter signup form    ◐ running   activation','#2 annual plan nudge      ✓ won       mrr','#3 drop card at trial     ✗ lost      signups'],ms:450},
 {t:'say',x:'Signups are up but activation fell 4 points, so the funnel is leaking after signup. I’ll check the trend before calling the running test.'},
 {t:'at',i:2},
 {t:'ask',name:'run_code',risk:'RUNS ON YOUR MACHINE',code:1,body:['python','import statistics as s','print(s.mean([41, 40, 38]))'],yes:['39.666666666666664'],after:{t:'say',x:'Three-week activation averages 39.7%, so 38% is a real dip, not noise.'}},
 {t:'at',i:3},
 {t:'tool',name:'log_experiment',arg:'“Add a checklist to first-run”',out:['logged #4 · planned · metric activation'],ms:500,},
 {t:'at',i:4},
 {t:'file',name:'review.md',body:'# weekly review\n\nKPI          week    change\nsignups      412     +12%\nmrr          $18.4k  +3%\nchurn        2.1%    -0.2pt\nactivation   38%     -4pt\n\nnext: ship a first-run checklist (#4).\nkeep #1 running one more week.'},
 {t:'at',i:5},
 {t:'say',x:'Done. Biggest issue is activation. I logged experiment #4 and saved review.md. Tap the file line to read it.'}],
leads:[
 {t:'plan',todos:['read KPIs for context','draft outreach to Acme','send after approval']},
 {t:'tool',name:'get_kpis',arg:'',out:['activation 38% · signups 412'],ms:400},{t:'at',i:1},
 {t:'say',x:'Acme’s onboarding looks like ours, so a short peer-style note should land. Drafting it now.'},{t:'at',i:2},
 {t:'ask',name:'send_email',risk:'SENDS EXTERNALLY',body:['to       ana@acme.dev','subject  Quick idea for Acme’s onboarding','','Hi Ana, we cut time-to-first-value by adding a','first-run checklist. Happy to share what worked.'],yes:['queued · 1 email'],after:{t:'say',x:'Sent. I’ll note the follow-up for Thursday.'}},
 {t:'at',i:3}],
experiment:[
 {t:'plan',todos:['read KPIs','write hypothesis','log it','save experiment.md']},
 {t:'tool',name:'get_kpis',arg:'',out:['activation 38% (-4pt)'],ms:400},{t:'at',i:1},
 {t:'say',x:'Hypothesis: a three-step checklist on first run lifts activation by 3 points within 14 days. Sample ≈ 2,400 users per arm.'},{t:'at',i:2},
 {t:'tool',name:'log_experiment',arg:'“first-run checklist”',out:['logged #4 · planned'],ms:450},{t:'at',i:3},
 {t:'file',name:'experiment.md',body:'# first-run checklist\n\nchange   3-step checklist on first run\nmetric   activation (day 14)\ntarget   +3pt\nsample   ~2,400 per arm\nstop     14 days or p<0.05'},{t:'at',i:4}],
install:[
 {t:'plan',todos:['fetch plugin source','install utm plugin','try utm_build']},
 {t:'say',x:'Installing a plugin means running code from a URL. Read it first, then decide.'},{t:'at',i:0},
 {t:'ask',name:'install_plugin',risk:'RUNS ARBITRARY CODE',body:['url   https://example.com/utm.js','name  utm'],note:'Plugins have full local access. Only install code you have read and trust.',yes:['installed utm · 1 tool added'],after:{t:'tool',name:'utm_build',arg:'url=https://acme.dev',out:['https://acme.dev?utm_source=sprig'],ms:500}},
 {t:'at',i:3}]
};
async function play(k){
  busy=true;abort=false;setSt();spin(true);
  try{for(const e of S[k])await step(e);if(P.el&&P.todos.length)P.at=P.todos.length,drawPlan()}
  catch(x){if(x!=='abort')throw x;if(pend)pend.decide(false);ln('dim','⎯ interrupted')}
  finally{busy=false;pend=null;spin(false);setSt()}
}

/* commands */
const HELP=['/review       weekly review','/leads        lead plan','/experiment   new experiment','/install      add a plugin','/experiments  list experiments','/artifacts    list files','/models       model picker','/config       agent config','/skills       installed skills','/sessions     sessions','/help','show help'];
function cmd(s){
  s=s.trim();if(!s)return;hist.push(s);hi=hist.length;ln('you',s);
  const l=s.toLowerCase();
  if(l==='/help'||l==='help')return ln('dim',HELP.join('\n'));
  if(l==='/clear'){T.replaceChildren();P.el=null;return banner()}
  if(l==='/theme')return $('#th').click();
  if(l==='/experiments')return ln('tbl',EXP.map((e,i)=>'#'+(i+1)+' '+e[0].padEnd(22)+' '+GL[e[1]]+' '+e[1]).join('\n'));
  if(l==='/artifacts'){const k=Object.keys(FILES);return k.length?k.forEach(n=>{const d=ln('file',['b','✎ '],n,['dim','  [view]']);d.onclick=()=>openFile(n)}):ln('dim','no files yet · try /review')}
  if(l==='/models'){ln('b','models');ln('dim','qwen3-coder · free · local · default');ln('dim','gpt-4o-mini');ln('dim','claude-haiku');ln('dim','switch via HARNESS_MODEL / mode select');return}
  if(l==='/config'){ln('b','config');ln('dim','model: qwen3-coder');ln('dim','base: http://localhost:11434/v1');ln('dim','skills: /skills');ln('dim','plugins: /install');return}
  if(l==='/skills'){const sk=['growth-review','seo-brief','content-engine'];sk.forEach(n=>{const d=ln('ri');const a=document.createElement('span'),c=document.createElement('span');a.textContent='◈ '+n;c.className='dim';c.textContent='installed';d.append(a,c)});return}
  if(l==='/sessions'){ln('b','sessions');ln('dim','1 active · sprig-demo (act) · 2 archived');return}
  const k=/review/.test(l)?'review':/lead/.test(l)?'leads':/experiment/.test(l)?'experiment':/install|plugin/.test(l)?'install':null;
  if(!k)return ln('dim','mockup: try /help or tap a command below');
  if(k==='review'||k==='experiment')if(!EXP.some(e=>e[0]==='first-run checklist'))EXP.push(['first-run checklist','planned']);drawExp();
  play(k);
}
function banner(){ln('b','sprig');ln('dim','growth agent · simulated session\nplans, runs tools, asks before anything risky.\ntry /review, or tap a command below.')}
['/review','/leads','/experiment','/install','/experiments','/artifacts','/models','/config','/skills','/sessions','/help'].forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.onclick=()=>{if(!busy)cmd(c)};$('#chips').append(b)});
Q.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(busy)return;const v=Q.value;Q.value='';if(v.startsWith('!')){ln('dim','$ '+v.slice(1));ln('dim','mock shell: '+v.slice(1));return}cmd(v)}
  if(e.key==='ArrowUp'&&hi>0){e.preventDefault();Q.value=hist[--hi]}
  if(e.key==='ArrowDown'){e.preventDefault();Q.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'')}
});
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&busy&&!palOpen)abort=true,pend&&pend.decide(false);
  if(pend&&!e.metaKey&&!e.ctrlKey&&Q.value===''&&(e.key==='y'||e.key==='n')){e.preventDefault();pend.decide(e.key==='y')}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();Q.focus()}
});
/* ---- OpenCode-style command palette (ctrl+p) ---- */
const PAL=[['/review','weekly review'],['/leads','lead plan'],['/experiment','new experiment'],['/install','add a plugin'],['/experiments','list experiments'],['/artifacts','list files'],['/models','model picker'],['/config','agent config'],['/skills','installed skills'],['/sessions','sessions'],['/help','show help']];
let palOpen=false,palQuery='',palIdx=0;
function palItems(){const q=palQuery.toLowerCase().replace(/^\//,'');return PAL.filter(c=>!q||c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q))}
function palRender(){const o=$('#pal-o');o.replaceChildren();const items=palItems();items.forEach((c,i)=>{const r=document.createElement('div');r.className='pal-i'+(i===palIdx?' on':'');const a=document.createElement('span');a.textContent=c[0];const b=document.createElement('span');b.className='dim';b.textContent=c[1];r.append(a,b);o.append(r)});$('#pal-t').textContent=palQuery?(' /'+palQuery+' - filter'):' commands';return items}
function palOpen_(){palOpen=true;palQuery='';palIdx=0;const d=$('#pal');d.style.display='flex';palRender();let l=$('#pal-l');if(!l){l=document.createElement('input');l.id='pal-l';l.style.outline='none';l.style.width='100%';l.style.background='none';l.style.border='0';l.style.color='var(--fg)';l.style.font='inherit';d.appendChild(l)}l.addEventListener('input',()=>{palQuery=l.value;palIdx=0;palRender()});l.focus()}
function palClose_(){palOpen=false;const d=$('#pal');d.style.display='none'}
function palExec(c){palClose_();if(!busy)cmd(c[0])}
$('#pal').addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();palClose_()}
  if(e.key==='ArrowDown'){e.preventDefault();const n=palItems();palIdx=Math.min(palIdx+1,n.length-1)}
  if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0)}
  if(e.key==='Enter'){e.preventDefault();const n=palItems();if(n[palIdx])palExec(n[palIdx])}
});
/* input filtering handled inside palOpen_ */
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='p'){e.preventDefault();if(!busy)palOpen_()}
});
drawExp();banner();setSt();
if(matchMedia('(pointer: fine)').matches)Q.focus();
</script>
<div id="pal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:50;align-items:flex-start;justify-content:center">
  <div style="width:min(560px,92vw);background:var(--bg);border:1px solid var(--fg);padding:10px 14px">
    <div id="pal-t" class="b" style="padding:4px 0 8px"></div>
    <div id="pal-o"></div>
    <div class="dim" style="padding-top:6px;font-size:.85em">up/down navigate - enter run - esc close</div>
  </div>
</div>
</body>
</html>
